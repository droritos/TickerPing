name: TickerPing 24/7 Stock Check

on:
  schedule:
    # Runs every 15 minutes Mon-Fri during trading hours (13:00 to 21:00 UTC)
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch: # Allows 1-click manual run anytime from GitHub

permissions:
  contents: write

jobs:
  check-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests python-dotenv matplotlib

      - name: Run Stock Price Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          DATA_FILE_PATH: alarms.json
        run: |
          python check_alarms.py

      - name: Commit & Push Alarm Trigger Status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alarms.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update alarm trigger status [skip ci]" && git push)
