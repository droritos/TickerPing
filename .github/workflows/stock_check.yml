name: TickerPing 24/7 Cloud Bot

on:
  schedule:
    # Schedules runner every 30m; queued runner takes over when active runner finishes 5h shift
    - cron: '*/30 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows 1-click manual trigger from GitHub anytime

concurrency:
  group: tickerping-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-cloud-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests python-dotenv matplotlib

      - name: Run 24/7 Cloud Runner
        env:
          TZ: "Asia/Jerusalem"
          BOT_TIMEZONE: "Asia/Jerusalem"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_FILE_PATH: alarms.json
          STATE_FILE_PATH: bot_state.json
          REMINDERS_FILE_PATH: reminders.json
          MAX_RUNTIME_SECONDS: 17100
          LOOP_INTERVAL_SECONDS: 60
        run: |
          python cloud_runner.py

      - name: Commit & Push Alarm Trigger Status & Bot State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alarms.json bot_state.json reminders.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync alarms, reminders, and bot state [skip ci]" && git push)

      - name: Dispatch Next Runner Shift (24/7 Continuous Relay)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "🚀 Triggering next 24/7 runner shift..."
            curl -f -s -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/stock_check.yml/dispatches \
              -d '{"ref":"main"}' && echo "✅ Successfully queued next runner shift!"
          else
            echo "ℹ️ GH_PAT secret not configured yet. Falling back to cron schedule."
          fi
